org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.41 sets build-type ABI filters before app configuration; those
# override defaultConfig and can reintroduce vendor ABIs with no Tim2Tox FFI.
# Keep ABI selection with the staged-FFI inventory in app/build.gradle.kts.
disable-abi-filtering=true

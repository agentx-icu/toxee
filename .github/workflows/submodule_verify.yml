name: Submodule Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when a PR is pushed again. Scoped to
  # pull_request so a push-to-master / tag / cron run is never aborted midway.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-submodule-pointers:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule pointers reachable on remotes
        run: bash tool/verify_submodule_remote.sh

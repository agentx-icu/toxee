name: Tim2Tox Auto Tests (PR)

# Tier 2 (PR-blocking): runs the tim2tox auto_tests scenario suite in
# virtual-clock mode (RUN_VIRTUAL=1) so every PR gets fast, deterministic
# feedback. Wall-clock + real-network coverage lives in the nightly and
# full-matrix workflows.
#
# Scope: phases 1-10, 12-14. ~30 min wall-time budget.
#   - Phase 5  (ToxAV)        included now that build_tim2tox.sh ships TOXAV=ON via --toxav.
#   - Phase 9  (conference)   INCLUDED as of 2026-08-08. It was excluded as a
#     "known flake under CI clock", but 126 historical test_results_*.log runs
#     (2026-05-14 .. 2026-08-03, RETRY_COUNT=0, i.e. raw first-attempt rates)
#     put Phase 9 at 21/244 = 8.6% — LOWER than five phases that were never
#     excluded: Phase 5 ToxAV 23.4%, Phase 12 22.7%, Phase 10 15.6%,
#     Phase 7 11.9%, Phase 4 10.2%; and identical to Phase 3 (8.6%). The
#     exclusion was drawn on the wrong axis: it gave up 9 conference scenarios
#     without touching the actual flake sources, which stayed in the gate.
#   - Phase 11 (network/DHT)  still excluded here (real WAN); it now runs
#     nightly — see auto_tests_nightly.yml for the same evidence.
#
# Trigger: PRs + pushes to main/master only. Ubuntu only to keep cost low.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when a PR is pushed again. Scoped to
  # pull_request so a push-to-master / tag / cron run is never aborted midway.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-tests-virtual:
    name: auto_tests (virtual, phases 1-10,12-14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Linux native dependencies
        # libsqlite3-dev: V2TIMCommunityManagerImpl links sqlite3 on non-Windows
        # builds; without it libtim2tox_ffi.so dies at dlopen with "undefined
        # symbol: sqlite3_open".
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsodium-dev \
            libopus-dev \
            libvpx-dev \
            libsqlite3-dev

      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart

      - name: Install toxee Flutter packages
        run: flutter pub get

      # See analyze.yml for the rationale. Separate cache key from that job's:
      # different mode (release) and an extra feature flag (--dht-bootstrap), so
      # the artifacts are NOT interchangeable.
      - name: Resolve tim2tox revision (cache key)
        id: t2t_rev
        # Read the SHA the SUPERPROJECT records rather than the submodule
        # worktree, so the key is identical no matter how (or whether) the
        # submodule was checked out in a given workflow.
        run: echo "sha=$(git rev-parse HEAD:third_party/tim2tox)" >> "$GITHUB_OUTPUT"

      - name: Cache libtim2tox_ffi (linux/release/toxav+dht)
        id: cache_native
        uses: actions/cache@v4
        with:
          path: build/native-artifacts/linux
          key: tim2tox-${{ runner.os }}-${{ runner.arch }}-linux-release-toxav-dht-${{ steps.t2t_rev.outputs.sha }}-${{ hashFiles('tool/ci/build_tim2tox.sh') }}

      - name: Build libtim2tox_ffi.so (Linux, toxav + DHT bootstrap)
        if: steps.cache_native.outputs.cache-hit != 'true'
        run: bash tool/ci/build_tim2tox.sh --target linux --mode release --toxav --dht-bootstrap

      - name: Stage libtim2tox_ffi.so for runtime loader
        id: stage_lib
        run: |
          set -euo pipefail
          src_dir="$GITHUB_WORKSPACE/build/native-artifacts/linux"
          if [[ ! -f "$src_dir/libtim2tox_ffi.so" ]]; then
            echo "::error::libtim2tox_ffi.so not found under $src_dir"
            ls -la "$src_dir" || true
            exit 1
          fi
          # Tim2ToxFfi._openLinux() falls back to DynamicLibrary.open('libtim2tox_ffi.so'),
          # which honours LD_LIBRARY_PATH. Export it for subsequent steps.
          echo "LD_LIBRARY_PATH=$src_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "lib_dir=$src_dir" >> "$GITHUB_OUTPUT"

      - name: Install auto_tests Flutter packages
        working-directory: third_party/tim2tox/auto_tests
        run: flutter pub get

      - name: Run auto_tests (RUN_VIRTUAL=1, phases 1-10,12-14)
        working-directory: third_party/tim2tox/auto_tests
        env:
          RUN_VIRTUAL: '1'
          RETRY_COUNT: '1'
          # Skip the in-script `flutter pub get` since we just ran it above.
          SKIP_PUB_GET: 'auto'
        run: |
          chmod +x ./run_tests_ordered.sh
          ./run_tests_ordered.sh 1-10 12-14

      # RETRY_COUNT=1 means a test that fails once and passes on retry is counted
      # PASSED, and the run stays green. run_tests_ordered.sh does record those in
      # a "Flaky Tests" section of the summary — but the artifact upload below used
      # to be `if: failure()`, so on exactly the runs that produce flake data the
      # data was thrown away. There was no mechanism anywhere that accumulated it.
      # Surface it in the job summary (always) so the trend is visible without
      # digging into artifacts.
      - name: Publish flaky/pass/fail summary
        if: ${{ always() }}
        working-directory: third_party/tim2tox/auto_tests
        run: |
          set -uo pipefail
          latest="$(ls -1t test_summary_*.txt 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest" ]; then
            echo "No test_summary_*.txt produced (the suite may have died before summarising)." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## auto_tests (virtual, phases 1-10,12-14)"
            echo
            echo '```'
            cat "$latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        # `always()`, not `failure()`: see the flaky-summary step above. A green
        # run with retries is precisely the run whose logs are worth keeping.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-tests-virtual-logs
          if-no-files-found: warn
          path: |
            third_party/tim2tox/auto_tests/test_results_*.log
            third_party/tim2tox/auto_tests/test_summary_*.txt
            third_party/tim2tox/auto_tests/merged_results/
